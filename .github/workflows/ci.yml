# Tests and lint on every push / pull request; a Windows installer for version tags (v2.0.0 ...).
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff mypy
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Types (mypy, informational)
        continue-on-error: true
        run: python -m mypy
      - name: Tests (including the real Windows API tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Security checks
        run: python -m pytest -q -p no:cacheprovider tests/test_security_static.py
      # BLOCKING: a known vulnerability in a dependency listed in requirements.txt fails the build. An accepted risk
      # goes in packaging/audit-ignore.txt as "<VULN-ID>  # reason, review by YYYY-MM-DD" so the exception is visible.
      - name: Dependency vulnerabilities (pip-audit, blocking)
        shell: pwsh
        run: |
          python -m pip install pip-audit
          $ignore = @()
          if (Test-Path packaging/audit-ignore.txt) {
            Get-Content packaging/audit-ignore.txt | Where-Object { $_ -match '^\s*[A-Za-z]+-[0-9A-Za-z-]+' } |
              ForEach-Object { $ignore += '--ignore-vuln'; $ignore += (($_.Trim()) -split '\s+')[0] }
          }
          python -m pip_audit -r requirements.txt @ignore
      # Informational: what is installed, its licences and a CycloneDX SBOM. Fails only if a package declares no licence.
      - name: Dependency inventory (SBOM, licences, lock list)
        run: python packaging/dependency_report.py dist-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            dist-report/

  build-smoke:
    # the packaged app must start: catches missing modules that tests (run from source) can't see
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          ./packaging/build.ps1 -SkipTests -SkipGpu
      - name: Smoke test the built app
        shell: pwsh
        run: |
          & dist\JARVIS\jarvis-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "jarvis-cli --version failed" }
          & dist\JARVIS\jarvis-cli.exe --info
          if ($LASTEXITCODE -ne 0) { throw "jarvis-cli --info failed" }
          & dist\JARVIS\jarvis-cli.exe --tools
          if ($LASTEXITCODE -ne 0) { throw "jarvis-cli --tools failed" }

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-smoke]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        env:
          JARVIS_SIGN_CERT_BASE64: ${{ secrets.JARVIS_SIGN_CERT_BASE64 }}
          JARVIS_SIGN_PASSWORD: ${{ secrets.JARVIS_SIGN_PASSWORD }}
        run: |
          python -m pip install -r requirements.txt
          if ($env:JARVIS_SIGN_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:JARVIS_SIGN_CERT_BASE64))
            $env:JARVIS_SIGN_CERT = $pfx
          }
          ./packaging/build.ps1 -SkipTests -SkipGpu -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-installer
          path: |
            dist/JarvisSetup-*.exe
            dist/update.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JarvisSetup-*.exe
            dist/update.json
